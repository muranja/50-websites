<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 Websites Google Doesn't Want You to Know</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: #0a0a0f;
    color: #c0c0c8;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(0,240,255,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(255,0,255,0.04) 0%, transparent 50%);
    animation: bgDrift 20s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes bgDrift {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(2%, 1%) rotate(1deg); }
    66% { transform: translate(-1%, -1%) rotate(-0.5deg); }
  }

  .scanline {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,240,255,0.008) 2px, rgba(0,240,255,0.008) 4px);
    pointer-events: none;
    z-index: 1;
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
  }

  header {
    text-align: center;
    padding: 2.5rem 0 1.5rem;
    border-bottom: 1px solid rgba(0,240,255,0.1);
    margin-bottom: 1.5rem;
  }

  .badge {
    display: inline-block;
    background: #00f0ff;
    color: #0a0a0f;
    padding: 0.25rem 1rem;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    line-height: 1.2;
    text-transform: uppercase;
    color: #f0f0ff;
    text-shadow: 0 0 30px rgba(0,240,255,0.3);
  }

  h1 em {
    font-style: normal;
    color: #00f0ff;
  }

  .subtitle {
    font-size: 1rem;
    color: #707078;
    margin-top: 0.5rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .count {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1rem;
    background: #0a0a0f;
    border: 1px solid rgba(255,0,255,0.3);
    padding: 0.4rem 1.1rem;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: #ff00ff;
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-bottom: 1.25rem;
  }
  @media (min-width: 640px) {
    .controls { flex-direction: row; align-items: stretch; }
  }

  .search-wrap {
    position: relative;
    flex: 1;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: #00f0ff;
    opacity: 0.5;
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    height: 100%;
    padding: 0.7rem 1rem 0.7rem 2.5rem;
    border: 1px solid rgba(0,240,255,0.15);
    background: rgba(0,240,255,0.03);
    color: #e0e0e8;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .search-wrap input:focus {
    border-color: rgba(0,240,255,0.5);
    background: rgba(0,240,255,0.06);
  }
  .search-wrap input::placeholder {
    color: #505058;
    font-family: 'Rajdhani', sans-serif;
  }

  .surprise-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1.2rem;
    border: none;
    background: #ff00ff;
    color: #0a0a0f;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .surprise-btn:hover {
    background: #ff33ff;
    box-shadow: 0 0 24px rgba(255,0,255,0.4);
  }
  .surprise-btn:active {
    transform: scale(0.97);
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    align-items: center;
    margin-bottom: 0.25rem;
  }

  .result-count {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: #505058;
    margin-right: 0.5rem;
  }

  .cat-pill {
    padding: 0.3rem 0.7rem;
    border: 1px solid rgba(0,240,255,0.12);
    background: transparent;
    color: #606068;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .cat-pill:hover {
    background: rgba(0,240,255,0.06);
    color: #00f0ff;
    border-color: rgba(0,240,255,0.25);
  }
  .cat-pill.active {
    background: rgba(0,240,255,0.1);
    border-color: #00f0ff;
    color: #00f0ff;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.5rem;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1024px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

  .card {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.7rem 0.8rem;
    border: 1px solid rgba(0,240,255,0.06);
    background: rgba(0,240,255,0.02);
    text-decoration: none;
    color: inherit;
    transition: all 0.15s ease;
    cursor: pointer;
    position: relative;
    opacity: 0;
    animation: cardIn 0.25s ease forwards;
  }
  .card.hidden { display: none; }
  .card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border: 1px solid transparent;
    transition: border-color 0.2s;
    pointer-events: none;
  }
  .card:hover {
    background: rgba(0,240,255,0.05);
    border-color: rgba(0,240,255,0.2);
    transform: translateX(2px);
  }
  .card.highlight {
    animation: glowPulse 1s ease;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes glowPulse {
    0%, 100% { border-color: rgba(0,240,255,0.06); box-shadow: none; }
    30% { border-color: #ff00ff; box-shadow: 0 0 24px rgba(255,0,255,0.2), inset 0 0 24px rgba(255,0,255,0.05); }
    70% { border-color: #ff00ff; box-shadow: 0 0 24px rgba(255,0,255,0.2), inset 0 0 24px rgba(255,0,255,0.05); }
  }

  .num {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    font-weight: 600;
    color: #404048;
    min-width: 1.6rem;
    letter-spacing: 0.05em;
    transition: color 0.2s;
  }
  .card:hover .num { color: #00f0ff; }

  .card-content { flex: 1; min-width: 0; }
  .card-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: #e0e0e8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.02em;
  }
  .card-desc {
    font-size: 0.75rem;
    color: #606068;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
  .card-link {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    color: #00f0ff;
    font-weight: 600;
    flex-shrink: 0;
    opacity: 0.4;
    transition: opacity 0.2s;
    letter-spacing: 0.05em;
  }
  .card:hover .card-link { opacity: 1; }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #0a0a0f;
    border: 1px solid #00f0ff;
    padding: 0.6rem 1.2rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: #e0e0e8;
    pointer-events: none;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast strong { color: #00f0ff; }

  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    display: none;
  }
  .empty-state.show { display: block; }
  .empty-state p {
    font-size: 0.9rem;
    color: #505058;
    font-weight: 500;
  }
  .empty-state svg {
    width: 40px;
    height: 40px;
    margin-bottom: 0.75rem;
    opacity: 0.2;
    stroke: #00f0ff;
  }

  footer {
    text-align: center;
    padding: 2rem 0 0.5rem;
    border-top: 1px solid rgba(0,240,255,0.06);
    margin-top: 2rem;
  }
  footer p {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    color: #404048;
  }
  footer a {
    color: #00f0ff;
    text-decoration: none;
    transition: color 0.2s;
  }
  footer a:hover { color: #ff00ff; }
</style>
</head>
<body>
<div class="scanline"></div>
<div class="container">
  <header>
    <div class="badge">curated list</div>
    <h1>50 Websites Google<br><em>Doesn't Want You to Know</em></h1>
    <p class="subtitle">the internet is bigger than the first page of results</p>
    <div class="count" id="totalBadge">52 tools / 8 categories</div>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="search sites..." autocomplete="off">
    </div>
    <button class="surprise-btn" id="surpriseBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4c0 2-2 4-4 4a4 4 0 0 1-4-4c0-2 2-4 4-4Z"/><path d="M12 14c4 0 8 1.5 8 4v2H4v-2c0-2.5 4-4 8-4Z"/></svg>
      SURPRISE ME
    </button>
  </div>

  <div class="filter-row" id="filterRow">
    <span class="result-count" id="resultCount">SHOWING 52</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <p>no sites match your search</p>
  </div>

  <footer>
    <p>made with curiosity / <a href="https://github.com/muranja/50-websites" target="_blank" rel="noopener">fork on github</a></p>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const sites = [
  { n:"01", t:"12ft.io", u:"https://12ft.io", d:"Bypass any paywall", c:"reading" },
  { n:"02", t:"Libgen", u:"https://libgen.is", d:"Millions of free textbooks", c:"reading" },
  { n:"03", t:"Sci-Hub", u:"https://sci-hub.se", d:"Free research papers", c:"reading" },
  { n:"06", t:"Internet Archive", u:"https://archive.org", d:"Access any old webpage ever", c:"reading" },
  { n:"07", t:"Project Gutenberg", u:"https://gutenberg.org", d:"70K free classic books", c:"reading" },
  { n:"08", t:"PDF Drive", u:"https://pdfdrive.com", d:"Free PDF downloads", c:"reading" },
  { n:"09", t:"Open Culture", u:"https://openculture.com", d:"Free courses from top unis", c:"reading" },
  { n:"04", t:"AlternativeTo", u:"https://alternativeto.net", d:"Find free app alternatives", c:"media" },
  { n:"05", t:"JustWatch", u:"https://justwatch.com", d:"Find where to stream anything", c:"media" },
  { n:"27", t:"Radio Garden", u:"https://radio.garden", d:"Listen to any radio worldwide", c:"media" },
  { n:"28", t:"Every Noise", u:"https://everynoise.com", d:"Explore every music genre", c:"media" },

  { n:"30", t:"Music for Programming", u:"https://musicforprogramming.net", d:"Music to focus with", c:"media" },
  { n:"11", t:"Photopea", u:"https://photopea.com", d:"Free Photoshop in browser", c:"images" },
  { n:"12", t:"Squoosh", u:"https://squoosh.app", d:"Compress any image free", c:"images" },
  { n:"13", t:"Remove.bg", u:"https://remove.bg", d:"Remove image backgrounds free", c:"images" },
  { n:"14", t:"Cleanup Pictures", u:"https://cleanup.pictures", d:"Erase objects from photos", c:"images" },
  { n:"15", t:"Unscreen", u:"https://unscreen.com", d:"Remove video backgrounds", c:"images" },
  { n:"16", t:"Carbon", u:"https://carbon.now.sh", d:"Turn code into art", c:"images" },
  { n:"17", t:"Ray.so", u:"https://ray.so", d:"Beautiful code screenshots", c:"images" },
  { n:"18", t:"Shots.so", u:"https://shots.so", d:"Free product mockups", c:"images" },
  { n:"19", t:"Smartmockups", u:"https://smartmockups.com", d:"Mockups without Photoshop", c:"images" },
  { n:"20", t:"Have I Been Pwned", u:"https://haveibeenpwned.com", d:"Check if you were hacked", c:"security" },
  { n:"21", t:"VirusTotal", u:"https://virustotal.com", d:"Scan any file for malware", c:"security" },
  { n:"22", t:"Privnote", u:"https://privnote.com", d:"Send self destructing messages", c:"security" },
  { n:"23", t:"Temp Mail", u:"https://temp-mail.org", d:"Disposable email instantly", c:"security" },
  { n:"24", t:"File.io", u:"https://file.io", d:"Share files that auto delete", c:"security" },
  { n:"25", t:"Archive.ph", u:"https://archive.ph", d:"Save any webpage forever", c:"security" },
  { n:"50", t:"10 Minute Mail", u:"https://10minutemail.com", d:"Temp email in seconds", c:"security" },
  { n:"10", t:"WolframAlpha", u:"https://wolframalpha.com", d:"Solve any math instantly", c:"research" },
  { n:"33", t:"Elicit", u:"https://elicit.org", d:"AI research paper assistant", c:"research" },
  { n:"34", t:"Consensus", u:"https://consensus.app", d:"Search what science agrees on", c:"research" },
  { n:"35", t:"Connected Papers", u:"https://connectedpapers.com", d:"Map research visually", c:"research" },
  { n:"36", t:"Semantic Scholar", u:"https://semanticscholar.org", d:"Free academic search", c:"research" },
  { n:"37", t:"SciSpace", u:"https://scispace.com", d:"Understand any research paper", c:"research" },
  { n:"38", t:"Summarize.tech", u:"https://summarize.tech", d:"Summarize any YouTube video", c:"research" },
  { n:"39", t:"Phind", u:"https://phind.com", d:"AI search for developers", c:"dev" },
  { n:"40", t:"Regex101", u:"https://regex101.com", d:"Test any regex instantly", c:"dev" },
  { n:"41", t:"Code Beautify", u:"https://codebeautify.org", d:"Format any code cleanly", c:"dev" },
  { n:"42", t:"JSON Formatter", u:"https://jsonformatter.org", d:"Read JSON like a human", c:"dev" },
  { n:"43", t:"Explain Shell", u:"https://explainshell.com", d:"Understand terminal commands", c:"dev" },
  { n:"51", t:"BbyCraft LLM Viz", u:"https://bbycroft.net/llm", d:"Visualize how LLMs work internally", c:"dev" },
  { n:"31", t:"myNoise", u:"https://mynoise.net", d:"Custom focus soundscapes", c:"productivity" },
  { n:"32", t:"Coffitivity", u:"https://coffitivity.com", d:"Cafe sounds for productivity", c:"productivity" },
  { n:"44", t:"Raindrop.io", u:"https://raindrop.io", d:"Bookmark manager that works", c:"productivity" },
  { n:"26", t:"Similar Sites", u:"https://similarsites.com", d:"Find any site alternatives", c:"productivity" },
  { n:"52", t:"SolitaireCC", u:"https://solitairecc.com", d:"Free solitaire card games for breaks", c:"productivity" },
  { n:"45", t:"Down Detector", u:"https://downdetector.com", d:"Check if any site is down", c:"utility" },
  { n:"46", t:"TinEye", u:"https://tineye.com", d:"Reverse image search", c:"utility" },
  { n:"47", t:"Fast.com", u:"https://fast.com", d:"Check your internet speed", c:"utility" },
  { n:"48", t:"Smallpdf", u:"https://smallpdf.com", d:"Edit PDFs free", c:"utility" },
  { n:"49", t:"iLovePDF", u:"https://ilovepdf.com", d:"Merge and split PDFs", c:"utility" }
];

const catMeta = {
  reading: "Free Content",
  media: "Media & Streaming",
  images: "Image & Design",
  security: "Security & Privacy",
  research: "Research & AI",
  dev: "Developer Tools",
  productivity: "Productivity & Sound",
  utility: "Everyday Utilities"
};

let activeCat = null;
let searchTerm = "";

const grid = document.getElementById("grid");
const searchInput = document.getElementById("searchInput");
const filterRow = document.getElementById("filterRow");
const resultCount = document.getElementById("resultCount");
const emptyState = document.getElementById("emptyState");
const toast = document.getElementById("toast");
const surpriseBtn = document.getElementById("surpriseBtn");

let toastTimer = null;
function showToast(msg) {
  clearTimeout(toastTimer);
  toast.innerHTML = msg;
  toast.classList.add("show");
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
}

function buildCatPills() {
  const cats = Object.entries(catMeta);
  cats.forEach(([key, label]) => {
    const btn = document.createElement("button");
    btn.className = "cat-pill";
    btn.dataset.cat = key;
    btn.textContent = label;
    btn.addEventListener("click", () => {
      if (activeCat === key) {
        activeCat = null;
        btn.classList.remove("active");
      } else {
        document.querySelectorAll(".cat-pill").forEach(b => b.classList.remove("active"));
        activeCat = key;
        btn.classList.add("active");
      }
      render();
    });
    filterRow.appendChild(btn);
  });
}

function render() {
  const filtered = sites.filter(s => {
    if (activeCat && s.c !== activeCat) return false;
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      if (!s.t.toLowerCase().includes(q) && !s.d.toLowerCase().includes(q) && !s.u.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  emptyState.classList.toggle("show", filtered.length === 0);
  resultCount.textContent = `SHOWING ${filtered.length}`;

  let html = "";
  const delay = 30;
  filtered.forEach((s, i) => {
    html += `<a href="${s.u}" class="card" target="_blank" rel="noopener" data-num="${s.n}" data-title="${s.t}" data-url="${s.u}" data-desc="${s.d}" style="animation-delay:${i*delay}ms">
      <span class="num">${s.n}</span>
      <div class="card-content">
        <div class="card-title">${s.t}</div>
        <div class="card-desc">${s.d}</div>
      </div>
      <span class="card-link">OPEN</span>
    </a>`;
  });
  grid.innerHTML = html;

  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", e => {
      const url = el.dataset.url;
      const title = el.dataset.title;
      e.preventDefault();
      navigator.clipboard.writeText(url).then(() => {
        showToast(`copied <strong>${title}</strong> to clipboard`);
      }).catch(() => {
        window.open(url, "_blank", "noopener");
      });
    });
  });
}

function surprise() {
  const cards = [...document.querySelectorAll(".card:not(.hidden)")];
  if (cards.length === 0) return;
  const target = cards.find(c => c.dataset.url === "https://solitairecc.com");
  const pick = target && Math.random() < 0.6 ? target : cards[Math.floor(Math.random() * cards.length)];
  pick.classList.remove("highlight");
  void pick.offsetWidth;
  pick.classList.add("highlight");
  pick.scrollIntoView({ behavior: "smooth", block: "center" });
  setTimeout(() => window.open(pick.dataset.url, "_blank", "noopener"), 500);
}

searchInput.addEventListener("input", () => {
  searchTerm = searchInput.value;
  render();
});

surpriseBtn.addEventListener("click", surprise);

buildCatPills();
render();
</script>
</body>
</html>
